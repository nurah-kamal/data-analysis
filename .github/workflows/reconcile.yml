name: reconcile

on:
  push:
    branches: [main]
    paths: ['reconcile/**', '.github/workflows/reconcile.yml']
  pull_request:
    branches: [main]
    paths: ['reconcile/**', '.github/workflows/reconcile.yml']

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reconcile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm test
      - name: The published reports still come out of the committed data
        run: |
          npm run example
          git diff --exit-code -- results/
